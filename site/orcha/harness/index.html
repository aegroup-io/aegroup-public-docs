html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

}

}

.table :is(th, td):last-child {

}

  padding: 0 !important;
  border: 0 !important;

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;product-agentic-harness&quot; class=&quot;dvh-root&quot;&gt;
  &lt;style&gt;
    #product-agentic-harness {
      color: var(--foreground);
      background: transparent;
      width: 100%;
    }

    #product-agentic-harness * {
      box-sizing: border-box;
    }

    #product-agentic-harness .dvh-header {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }

    #product-agentic-harness h1,
    #product-agentic-harness h2,
    #product-agentic-harness h3,
    #product-agentic-harness p {
      margin: 0;
    }

    #product-agentic-harness h1 {
      font-weight: 500;
    }

    #product-agentic-harness .dvh-deck {
      color: var(--muted-foreground);
      max-width: 80ch;
    }

    #product-agentic-harness .dvh-controls {
      align-items: center;
      gap: 8px;
    }

    #product-agentic-harness .dvh-focus-summary {
      display: flex;
      align-items: center;
      min-height: 46px;
      color: var(--card-foreground);
    }

    #product-agentic-harness .dvh-chart {
      display: grid;
      gap: 22px;
    }

    #product-agentic-harness .dvh-band {
      position: relative;
      display: grid;
      gap: 12px;
    }

    #product-agentic-harness .dvh-band-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 7px;
    }

    #product-agentic-harness .dvh-band-title {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    #product-agentic-harness .dvh-index {
      color: var(--muted-foreground);
      font-variant-numeric: tabular-nums;
    }

    #product-agentic-harness .dvh-band-note {
      color: var(--muted-foreground);
      text-align: right;
    }

    #product-agentic-harness .dvh-node,
    #product-agentic-harness .dvh-stage,
    #product-agentic-harness .dvh-lane,
    #product-agentic-harness .dvh-gate,
    #product-agentic-harness .dvh-loop-step {
      --dvh-tone: var(--border);
      border: 1px solid color-mix(in srgb, var(--dvh-tone) 42%, var(--border));
      border-left: 4px solid var(--dvh-tone);
      border-radius: 10px;
      background: color-mix(in srgb, var(--dvh-tone) 9%, transparent);
      transition: opacity 160ms ease, background-color 160ms ease, border-color 160ms ease;
    }

    #product-agentic-harness .dvh-orchestration { --dvh-tone: var(--viz-series-1); }
    #product-agentic-harness .dvh-skill { --dvh-tone: var(--viz-series-2); }
    #product-agentic-harness .dvh-component { --dvh-tone: var(--viz-series-3); }
    #product-agentic-harness .dvh-quality { --dvh-tone: var(--viz-series-4); }
    #product-agentic-harness .dvh-cyber { --dvh-tone: var(--viz-series-5); }
    #product-agentic-harness .dvh-human { --dvh-tone: var(--viz-series-6); }

    #product-agentic-harness .dvh-focusable.is-dim {
      opacity: 0.18;
    }

    #product-agentic-harness .dvh-focusable.is-focus {
      background: color-mix(in srgb, var(--dvh-tone) 16%, transparent);
      border-color: var(--dvh-tone);
    }

    #product-agentic-harness .dvh-spine {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      align-items: stretch;
    }

    #product-agentic-harness .dvh-stage {
      position: relative;
      min-height: 132px;
      padding: 12px 11px;
    }

    #product-agentic-harness .dvh-stage:not(:last-child)::after {
      content: &quot;→&quot;;
      position: absolute;
      z-index: 2;
      top: 50%;
      right: -11px;
      translate: 50% -50%;
      color: var(--foreground);
      background: var(--background);
      padding: 1px 2px;
      font-size: calc(var(--font-size-base) * 0.9);
    }

    #product-agentic-harness .dvh-kicker {
      color: var(--muted-foreground);
      font-size: max(11px, calc(var(--font-size-base) * 0.72));
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }

    #product-agentic-harness .dvh-stage h3,
    #product-agentic-harness .dvh-lane h3,
    #product-agentic-harness .dvh-gate h3,
    #product-agentic-harness .dvh-loop-step h3 {
      margin-top: 5px;
      font-weight: 500;
      font-size: calc(var(--font-size-base) * 0.88);
    }

    #product-agentic-harness .dvh-stage p,
    #product-agentic-harness .dvh-lane p,
    #product-agentic-harness .dvh-gate p,
    #product-agentic-harness .dvh-loop-step p {
      margin-top: 7px;
      color: var(--muted-foreground);
      font-size: max(11px, calc(var(--font-size-base) * 0.72));
    }

    #product-agentic-harness .dvh-artifact {
      display: block;
      margin-top: 8px;
      color: var(--foreground);
      font-size: max(11px, calc(var(--font-size-base) * 0.7));
    }

    #product-agentic-harness .dvh-skill-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    #product-agentic-harness .dvh-skill-group {
      padding: 11px;
    }

    #product-agentic-harness .dvh-skill-group h3 {
      font-weight: 500;
      font-size: calc(var(--font-size-base) * 0.82);
    }

    #product-agentic-harness .dvh-skill-list {
      display: grid;
      gap: 8px;
      margin-top: 9px;
    }

    #product-agentic-harness .dvh-skill-item {
      display: grid;
      gap: 2px;
      padding-top: 7px;
      border-top: 1px solid color-mix(in srgb, var(--border) 68%, transparent);
    }

    #product-agentic-harness .dvh-skill-item:first-child {
      padding-top: 0;
      border-top: 0;
    }

    #product-agentic-harness .dvh-skill-item code {
      color: var(--foreground);
      font-size: max(11px, calc(var(--font-size-base) * 0.72));
    }

    #product-agentic-harness .dvh-skill-item span {
      color: var(--muted-foreground);
      font-size: max(11px, calc(var(--font-size-base) * 0.68));
    }

    #product-agentic-harness .dvh-router {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
    }

    #product-agentic-harness .dvh-router strong {
      font-weight: 500;
    }

    #product-agentic-harness .dvh-router span {
      color: var(--muted-foreground);
      font-size: max(11px, calc(var(--font-size-base) * 0.72));
    }

    #product-agentic-harness .dvh-router code {
      font-size: inherit;
    }

    #product-agentic-harness .dvh-router-arrow {
      color: var(--foreground) !important;
      font-size: max(15px, calc(var(--font-size-base) * 1.05)) !important;
    }

    #product-agentic-harness .dvh-lanes {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    #product-agentic-harness .dvh-lane {
      min-height: 126px;
      padding: 11px;
    }

    #product-agentic-harness .dvh-lane-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    #product-agentic-harness .dvh-lane-head code {
      color: var(--muted-foreground);
      font-size: max(11px, calc(var(--font-size-base) * 0.68));
    }

    #product-agentic-harness .dvh-proof {
      margin-top: 9px;
      color: var(--foreground);
      font-size: max(11px, calc(var(--font-size-base) * 0.68));
    }

    #product-agentic-harness .dvh-assurance-grid {
      display: grid;
      grid-template-columns: 1.45fr 1fr 1fr;
      gap: 12px;
      align-items: stretch;
    }

    #product-agentic-harness .dvh-assurance-column {
      display: grid;
      align-content: start;
      gap: 9px;
    }

    #product-agentic-harness .dvh-column-label {
      color: var(--muted-foreground);
      font-size: max(11px, calc(var(--font-size-base) * 0.72));
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    #product-agentic-harness .dvh-ci-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    #product-agentic-harness .dvh-gate {
      min-height: 92px;
      padding: 10px;
    }

    #product-agentic-harness .dvh-gate.compact {
      min-height: 74px;
    }

    #product-agentic-harness .dvh-gate.dashed {
      border-style: dashed;
    }

    #product-agentic-harness .dvh-merge-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 0.82fr) auto minmax(0, 0.82fr);
      align-items: center;
      gap: 10px;
      margin-top: 2px;
    }

    #product-agentic-harness .dvh-merge-node {
      padding: 12px;
      text-align: center;
    }

    #product-agentic-harness .dvh-merge-node strong {
      display: block;
      font-weight: 500;
    }

    #product-agentic-harness .dvh-merge-node span {
      display: block;
      margin-top: 5px;
      color: var(--muted-foreground);
      font-size: max(11px, calc(var(--font-size-base) * 0.7));
    }

    #product-agentic-harness .dvh-loop {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    #product-agentic-harness .dvh-loop-step {
      min-height: 118px;
      padding: 11px;
    }

    #product-agentic-harness .dvh-loop-return {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
    }

    #product-agentic-harness .dvh-loop-return strong {
      font-weight: 500;
    }

    #product-agentic-harness .dvh-loop-return span {
      color: var(--muted-foreground);
      text-align: center;
      font-size: max(11px, calc(var(--font-size-base) * 0.7));
    }

    #product-agentic-harness .dvh-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      color: var(--muted-foreground);
      font-size: max(11px, calc(var(--font-size-base) * 0.68));
    }

    #product-agentic-harness .dvh-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #product-agentic-harness .dvh-swatch {
      width: 14px;
      height: 8px;
      border-radius: 2px;
      background: var(--dvh-tone);
    }

    #product-agentic-harness .dvh-source {
      color: var(--muted-foreground);
      font-size: max(11px, calc(var(--font-size-base) * 0.66));
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    @media (max-width: 900px) {
      #product-agentic-harness .dvh-spine {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      #product-agentic-harness .dvh-stage:nth-child(3)::after {
        content: &quot;↓&quot;;
        top: auto;
        right: 50%;
        bottom: -11px;
        translate: 50% 50%;
      }

      #product-agentic-harness .dvh-stage:nth-child(4) { grid-column: 3; grid-row: 2; }
      #product-agentic-harness .dvh-stage:nth-child(5) { grid-column: 2; grid-row: 2; }
      #product-agentic-harness .dvh-stage:nth-child(6) { grid-column: 1; grid-row: 2; }
      #product-agentic-harness .dvh-stage:nth-child(4)::after,
      #product-agentic-harness .dvh-stage:nth-child(5)::after {
        content: &quot;←&quot;;
        right: auto;
        left: -11px;
        translate: -50% -50%;
      }

      #product-agentic-harness .dvh-skill-grid,
      #product-agentic-harness .dvh-lanes,
      #product-agentic-harness .dvh-loop {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      #product-agentic-harness .dvh-assurance-grid {
        grid-template-columns: 1fr 1fr;
      }

      #product-agentic-harness .dvh-assurance-column:first-child {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 620px) {
      #product-agentic-harness .dvh-band-head,
      #product-agentic-harness .dvh-router,
      #product-agentic-harness .dvh-merge-bar,
      #product-agentic-harness .dvh-loop-return {
        grid-template-columns: 1fr;
      }

      #product-agentic-harness .dvh-band-head {
        display: grid;
      }

      #product-agentic-harness .dvh-band-note {
        text-align: left;
      }

      #product-agentic-harness .dvh-router-arrow,
      #product-agentic-harness .dvh-merge-arrow,
      #product-agentic-harness .dvh-loop-arrow {
        rotate: 90deg;
        justify-self: center;
      }

      #product-agentic-harness .dvh-spine,
      #product-agentic-harness .dvh-skill-grid,
      #product-agentic-harness .dvh-lanes,
      #product-agentic-harness .dvh-assurance-grid,
      #product-agentic-harness .dvh-loop {
        grid-template-columns: 1fr;
      }

      #product-agentic-harness .dvh-stage,
      #product-agentic-harness .dvh-stage:nth-child(4),
      #product-agentic-harness .dvh-stage:nth-child(5),
      #product-agentic-harness .dvh-stage:nth-child(6),
      #product-agentic-harness .dvh-assurance-column:first-child {
        grid-column: auto;
        grid-row: auto;
      }

      #product-agentic-harness .dvh-stage:not(:last-child)::after,
      #product-agentic-harness .dvh-stage:nth-child(3)::after,
      #product-agentic-harness .dvh-stage:nth-child(4)::after,
      #product-agentic-harness .dvh-stage:nth-child(5)::after {
        content: &quot;↓&quot;;
        top: auto;
        right: 50%;
        bottom: -11px;
        left: auto;
        translate: 50% 50%;
      }

      #product-agentic-harness .dvh-ci-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #product-agentic-harness .dvh-focusable {
        transition: none;
      }
    }
  &lt;/style&gt;

  &lt;header class=&quot;dvh-header&quot;&gt;
    &lt;div&gt;
      &lt;h1&gt;Product agentic delivery harness&lt;/h1&gt;
      &lt;p class=&quot;dvh-deck&quot;&gt;Deep system view: versioned skills guide isolated agent lanes; changed-area CI and independent assurance prove the result; the orchestrator closes the loop without automating the final human merge.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;viz-controls dvh-controls&quot; aria-label=&quot;Highlight a harness layer&quot;&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; data-focus=&quot;all&quot; aria-pressed=&quot;true&quot;&gt;Everything&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-focus=&quot;skills&quot; aria-pressed=&quot;false&quot;&gt;Skills&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-focus=&quot;components&quot; aria-pressed=&quot;false&quot;&gt;Components&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-focus=&quot;assurance&quot; aria-pressed=&quot;false&quot;&gt;CI + quality&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-focus=&quot;cyber&quot; aria-pressed=&quot;false&quot;&gt;Cyber&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-focus=&quot;ops&quot; aria-pressed=&quot;false&quot;&gt;Orchestrator loop&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card dvh-focus-summary&quot; aria-live=&quot;polite&quot; data-focus-summary&gt;
      End to end: approved intent → scoped issue → isolated implementation → evidence-backed PR → human merge → monitored project state.
    &lt;/div&gt;
  &lt;/header&gt;

  &lt;main class=&quot;dvh-chart&quot; aria-label=&quot;Deep architecture map of the Product development harness&quot;&gt;
    &lt;section class=&quot;dvh-band&quot; aria-labelledby=&quot;dvh-spine-title&quot;&gt;
      &lt;div class=&quot;dvh-band-head&quot;&gt;
        &lt;div class=&quot;dvh-band-title&quot;&gt;&lt;span class=&quot;dvh-index&quot;&gt;01&lt;/span&gt;&lt;h2 id=&quot;dvh-spine-title&quot;&gt;Executive delivery spine&lt;/h2&gt;&lt;/div&gt;
        &lt;span class=&quot;dvh-band-note&quot;&gt;The same control path governs a narrow issue or a multi-lane epic.&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;dvh-spine&quot;&gt;
        &lt;article class=&quot;dvh-stage dvh-skill dvh-focusable&quot; data-tags=&quot;skills ops&quot;&gt;
          &lt;div class=&quot;dvh-kicker&quot;&gt;01 · Shape&lt;/div&gt;
          &lt;h3&gt;Executable intent&lt;/h3&gt;
          &lt;p&gt;Approved feedback or request becomes one scoped issue with outcome, requirements, acceptance criteria, demo plan, and non-goals.&lt;/p&gt;
          &lt;span class=&quot;dvh-artifact&quot;&gt;Artifact: issue in &lt;strong&gt;Triage → Ready&lt;/strong&gt;&lt;/span&gt;
        &lt;/article&gt;
        &lt;article class=&quot;dvh-stage dvh-orchestration dvh-focusable&quot; data-tags=&quot;skills ops&quot;&gt;
          &lt;div class=&quot;dvh-kicker&quot;&gt;02 · Classify&lt;/div&gt;
          &lt;h3&gt;Orchestrator chooses mode&lt;/h3&gt;
          &lt;p&gt;GitHub labels decide single-issue versus epic. Scope, dependencies, and acceptance signals become lane contracts.&lt;/p&gt;
          &lt;span class=&quot;dvh-artifact&quot;&gt;Single: 1 lane · Epic: integration + bounded lanes&lt;/span&gt;
        &lt;/article&gt;
        &lt;article class=&quot;dvh-stage dvh-component dvh-focusable&quot; data-tags=&quot;components skills ops&quot;&gt;
          &lt;div class=&quot;dvh-kicker&quot;&gt;03 · Isolate + build&lt;/div&gt;
          &lt;h3&gt;Agent worktree lane(s)&lt;/h3&gt;
          &lt;p&gt;Each lane gets its own branch, worktree, namespace, ports, temp roots, service stack, scope, non-goals, and tests.&lt;/p&gt;
          &lt;span class=&quot;dvh-artifact&quot;&gt;State: &lt;strong&gt;In Progress&lt;/strong&gt;&lt;/span&gt;
        &lt;/article&gt;
        &lt;article class=&quot;dvh-stage dvh-quality dvh-focusable&quot; data-tags=&quot;skills assurance ops&quot;&gt;
          &lt;div class=&quot;dvh-kicker&quot;&gt;04 · Package&lt;/div&gt;
          &lt;h3&gt;Evidence-backed draft PR&lt;/h3&gt;
          &lt;p&gt;Exact local checks, demo artifacts, docs impact, risks, and one closing issue link are bound to the current head SHA.&lt;/p&gt;
          &lt;span class=&quot;dvh-artifact&quot;&gt;Artifact: draft PR against &lt;strong&gt;dev&lt;/strong&gt;&lt;/span&gt;
        &lt;/article&gt;
        &lt;article class=&quot;dvh-stage dvh-cyber dvh-focusable&quot; data-tags=&quot;assurance cyber ops&quot;&gt;
          &lt;div class=&quot;dvh-kicker&quot;&gt;05 · Prove&lt;/div&gt;
          &lt;h3&gt;Parallel assurance fabric&lt;/h3&gt;
          &lt;p&gt;Changed-area CI, advisory review, visual evidence, manifest policy, and release/security checks produce reviewable evidence.&lt;/p&gt;
          &lt;span class=&quot;dvh-artifact&quot;&gt;Failure or stale SHA loops back to its owner&lt;/span&gt;
        &lt;/article&gt;
        &lt;article class=&quot;dvh-stage dvh-human dvh-focusable&quot; data-tags=&quot;assurance ops&quot;&gt;
          &lt;div class=&quot;dvh-kicker&quot;&gt;06 · Decide&lt;/div&gt;
          &lt;h3&gt;Readiness + human merge&lt;/h3&gt;
          &lt;p&gt;The audit returns ready, ready-with-risks, or not-ready. The Product Owner remains the merge operator; Done begins only after merge.&lt;/p&gt;
          &lt;span class=&quot;dvh-artifact&quot;&gt;Control point: human judgment&lt;/span&gt;
        &lt;/article&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dvh-band&quot; aria-labelledby=&quot;dvh-skills-title&quot;&gt;
      &lt;div class=&quot;dvh-band-head&quot;&gt;
        &lt;div class=&quot;dvh-band-title&quot;&gt;&lt;span class=&quot;dvh-index&quot;&gt;02&lt;/span&gt;&lt;h2 id=&quot;dvh-skills-title&quot;&gt;Versioned workflow memory · 11 repo-local skills&lt;/h2&gt;&lt;/div&gt;
        &lt;span class=&quot;dvh-band-note&quot;&gt;AGENTS.md routes agents into executable, testable SKILL.md contracts.&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;dvh-skill-grid&quot;&gt;
        &lt;article class=&quot;dvh-node dvh-skill dvh-skill-group dvh-focusable&quot; data-tags=&quot;skills ops&quot;&gt;
          &lt;h3&gt;Shape &amp;amp; govern&lt;/h3&gt;
          &lt;div class=&quot;dvh-skill-list&quot;&gt;
            &lt;div class=&quot;dvh-skill-item&quot;&gt;&lt;code&gt;feedback-approval-converter&lt;/code&gt;&lt;span&gt;Approved feedback → linked delivery issue(s)&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;dvh-skill-item&quot;&gt;&lt;code&gt;issue-shaper&lt;/code&gt;&lt;span&gt;Definition of Ready, scope, acceptance, demo plan&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;dvh-skill-item&quot;&gt;&lt;code&gt;manager-lifecycle&lt;/code&gt;&lt;span&gt;Triage → Ready → In Progress ↔ Blocked → In Review → Done&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;
        &lt;article class=&quot;dvh-node dvh-skill dvh-skill-group dvh-focusable&quot; data-tags=&quot;skills components ops&quot;&gt;
          &lt;h3&gt;Isolate &amp;amp; run&lt;/h3&gt;
          &lt;div class=&quot;dvh-skill-list&quot;&gt;
            &lt;div class=&quot;dvh-skill-item&quot;&gt;&lt;code&gt;worktree-bringup&lt;/code&gt;&lt;span&gt;One lane, one namespace, collision-free ports and roots&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;dvh-skill-item&quot;&gt;&lt;code&gt;local-bringup&lt;/code&gt;&lt;span&gt;Env generation, Postgres/Azurite, services, smoke, reset&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;
        &lt;article class=&quot;dvh-node dvh-skill dvh-skill-group dvh-focusable&quot; data-tags=&quot;skills assurance components&quot;&gt;
          &lt;h3&gt;Validate &amp;amp; demonstrate&lt;/h3&gt;
          &lt;div class=&quot;dvh-skill-list&quot;&gt;
            &lt;div class=&quot;dvh-skill-item&quot;&gt;&lt;code&gt;changed-area-test-selector&lt;/code&gt;&lt;span&gt;Narrowest credible tests, then cross-service smoke&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;dvh-skill-item&quot;&gt;&lt;code&gt;feature-demo-capture&lt;/code&gt;&lt;span&gt;Screenshots, diffs, route clips, walkthrough evidence&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;
        &lt;article class=&quot;dvh-node dvh-skill dvh-skill-group dvh-focusable&quot; data-tags=&quot;skills assurance cyber ops&quot;&gt;
          &lt;h3&gt;Review &amp;amp; close&lt;/h3&gt;
          &lt;div class=&quot;dvh-skill-list&quot;&gt;
            &lt;div class=&quot;dvh-skill-item&quot;&gt;&lt;code&gt;code-reviewer&lt;/code&gt;&lt;span&gt;Correctness, regressions, risky boundaries, missing tests&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;dvh-skill-item&quot;&gt;&lt;code&gt;dbt-sql-reviewer&lt;/code&gt;&lt;span&gt;ref/source, schema drift, compile/parse/execute semantics&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;dvh-skill-item&quot;&gt;&lt;code&gt;pr-packager&lt;/code&gt;&lt;span&gt;Template, evidence, sensitive-data gate, one Closes link&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;dvh-skill-item&quot;&gt;&lt;code&gt;merge-readiness-auditor&lt;/code&gt;&lt;span&gt;Fresh-SHA evidence, blockers, risks, human-ready decision&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dvh-band&quot; aria-labelledby=&quot;dvh-components-title&quot;&gt;
      &lt;div class=&quot;dvh-band-head&quot;&gt;
        &lt;div class=&quot;dvh-band-title&quot;&gt;&lt;span class=&quot;dvh-index&quot;&gt;03&lt;/span&gt;&lt;h2 id=&quot;dvh-components-title&quot;&gt;Component execution surface · local proof mirrors CI&lt;/h2&gt;&lt;/div&gt;
        &lt;span class=&quot;dvh-band-note&quot;&gt;Shared contracts intentionally trigger adjacent lanes.&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;dvh-router dvh-node dvh-orchestration dvh-focusable&quot; data-tags=&quot;components assurance ops&quot;&gt;
        &lt;div&gt;&lt;strong&gt;Changed files + architecture constraints&lt;/strong&gt;&lt;br&gt;&lt;span&gt;AGENTS routers, target-environment authority, issue scope&lt;/span&gt;&lt;/div&gt;
        &lt;span class=&quot;dvh-router-arrow&quot;&gt;→&lt;/span&gt;
        &lt;div&gt;&lt;strong&gt;Changed-area selector&lt;/strong&gt;&lt;br&gt;&lt;span&gt;&lt;code&gt;ci_changed_area_selector.py&lt;/code&gt; maps paths to the narrowest credible checks&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;dvh-lanes&quot;&gt;
        &lt;article class=&quot;dvh-lane dvh-component dvh-focusable&quot; data-tags=&quot;components assurance cyber&quot;&gt;
          &lt;div class=&quot;dvh-lane-head&quot;&gt;&lt;h3&gt;API&lt;/h3&gt;&lt;code&gt;api/&lt;/code&gt;&lt;/div&gt;
          &lt;p&gt;FastAPI contracts, auth, migrations, OpenAPI, worker enqueue.&lt;/p&gt;
          &lt;div class=&quot;dvh-proof&quot;&gt;compile · full unit suite · OpenAPI/APIM alignment&lt;/div&gt;
        &lt;/article&gt;
        &lt;article class=&quot;dvh-lane dvh-component dvh-focusable&quot; data-tags=&quot;components assurance cyber&quot;&gt;
          &lt;div class=&quot;dvh-lane-head&quot;&gt;&lt;h3&gt;Web&lt;/h3&gt;&lt;code&gt;web/&lt;/code&gt;&lt;/div&gt;
          &lt;p&gt;React/Vite UI, server behavior, deterministic visual fixtures.&lt;/p&gt;
          &lt;div class=&quot;dvh-proof&quot;&gt;Vitest + server tests · authz smoke · ESLint · build · visual gate&lt;/div&gt;
        &lt;/article&gt;
        &lt;article class=&quot;dvh-lane dvh-component dvh-focusable&quot; data-tags=&quot;components assurance cyber&quot;&gt;
          &lt;div class=&quot;dvh-lane-head&quot;&gt;&lt;h3&gt;Worker&lt;/h3&gt;&lt;code&gt;worker/&lt;/code&gt;&lt;/div&gt;
          &lt;p&gt;Handlers, queues, retries, idempotency, deployment attestation.&lt;/p&gt;
          &lt;div class=&quot;dvh-proof&quot;&gt;compile · full unit suite · deploy/env + attestation tests&lt;/div&gt;
        &lt;/article&gt;
        &lt;article class=&quot;dvh-lane dvh-component dvh-focusable&quot; data-tags=&quot;components assurance cyber&quot;&gt;
          &lt;div class=&quot;dvh-lane-head&quot;&gt;&lt;h3&gt;Extractor&lt;/h3&gt;&lt;code&gt;extractor/&lt;/code&gt;&lt;/div&gt;
          &lt;p&gt;Runtime, shared contract, compatibility BOM, image roles.&lt;/p&gt;
          &lt;div class=&quot;dvh-proof&quot;&gt;frozen lock · Ruff · unit · boundary/BOM · secret scan · image/role smoke&lt;/div&gt;
        &lt;/article&gt;
        &lt;article class=&quot;dvh-lane dvh-component dvh-focusable&quot; data-tags=&quot;components assurance&quot;&gt;
          &lt;div class=&quot;dvh-lane-head&quot;&gt;&lt;h3&gt;MCP&lt;/h3&gt;&lt;code&gt;mcp/&lt;/code&gt;&lt;/div&gt;
          &lt;p&gt;Private FastMCP service aligned to API and token contracts.&lt;/p&gt;
          &lt;div class=&quot;dvh-proof&quot;&gt;compile · package install · app import/manual run&lt;/div&gt;
        &lt;/article&gt;
        &lt;article class=&quot;dvh-lane dvh-component dvh-focusable&quot; data-tags=&quot;components assurance cyber&quot;&gt;
          &lt;div class=&quot;dvh-lane-head&quot;&gt;&lt;h3&gt;Infra&lt;/h3&gt;&lt;code&gt;infra/&lt;/code&gt;&lt;/div&gt;
          &lt;p&gt;Terraform, AKS, APIM policy, App Service, deployment assets.&lt;/p&gt;
          &lt;div class=&quot;dvh-proof&quot;&gt;terraform fmt · Node policy tests · manifest policy&lt;/div&gt;
        &lt;/article&gt;
        &lt;article class=&quot;dvh-lane dvh-component dvh-focusable&quot; data-tags=&quot;components assurance skills&quot;&gt;
          &lt;div class=&quot;dvh-lane-head&quot;&gt;&lt;h3&gt;Docs &amp;amp; harness&lt;/h3&gt;&lt;code&gt;docs/ · skills/ · scripts/&lt;/code&gt;&lt;/div&gt;
          &lt;p&gt;Agent routers, skills, local tooling, runbooks, architecture.&lt;/p&gt;
          &lt;div class=&quot;dvh-proof&quot;&gt;asset validator · harness unit tests · shell lint · strict internal docs&lt;/div&gt;
        &lt;/article&gt;
        &lt;article class=&quot;dvh-lane dvh-component dvh-focusable&quot; data-tags=&quot;components assurance ops&quot;&gt;
          &lt;div class=&quot;dvh-lane-head&quot;&gt;&lt;h3&gt;Cross-component&lt;/h3&gt;&lt;code&gt;.github/ · contracts&lt;/code&gt;&lt;/div&gt;
          &lt;p&gt;Workflow edits fan out broadly; extractor contracts intentionally select API + worker + extractor.&lt;/p&gt;
          &lt;div class=&quot;dvh-proof&quot;&gt;combine narrow suites · add smallest useful smoke pass&lt;/div&gt;
        &lt;/article&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dvh-band&quot; aria-labelledby=&quot;dvh-assurance-title&quot;&gt;
      &lt;div class=&quot;dvh-band-head&quot;&gt;
        &lt;div class=&quot;dvh-band-title&quot;&gt;&lt;span class=&quot;dvh-index&quot;&gt;04&lt;/span&gt;&lt;h2 id=&quot;dvh-assurance-title&quot;&gt;CI, review, visual, cyber, and release assurance&lt;/h2&gt;&lt;/div&gt;
        &lt;span class=&quot;dvh-band-note&quot;&gt;Nine GitHub workflows; independent evidence converges on one readiness view.&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;dvh-assurance-grid&quot;&gt;
        &lt;div class=&quot;dvh-assurance-column&quot;&gt;
          &lt;div class=&quot;dvh-column-label&quot;&gt;CI workflow · router + 8 conditional jobs&lt;/div&gt;
          &lt;div class=&quot;dvh-ci-grid&quot;&gt;
            &lt;article class=&quot;dvh-gate compact dvh-quality dvh-focusable&quot; data-tags=&quot;assurance components skills&quot;&gt;&lt;h3&gt;harness&lt;/h3&gt;&lt;p&gt;Skills/AGENTS validation, script tests, shell lint, strict internal docs&lt;/p&gt;&lt;/article&gt;
            &lt;article class=&quot;dvh-gate compact dvh-quality dvh-focusable&quot; data-tags=&quot;assurance components&quot;&gt;&lt;h3&gt;api&lt;/h3&gt;&lt;p&gt;Install, compile, full unittest discovery&lt;/p&gt;&lt;/article&gt;
            &lt;article class=&quot;dvh-gate compact dvh-quality dvh-focusable&quot; data-tags=&quot;assurance components&quot;&gt;&lt;h3&gt;worker&lt;/h3&gt;&lt;p&gt;Compile, full tests, deploy and attestation checks&lt;/p&gt;&lt;/article&gt;
            &lt;article class=&quot;dvh-gate compact dvh-cyber dvh-focusable&quot; data-tags=&quot;assurance components cyber&quot;&gt;&lt;h3&gt;extractor&lt;/h3&gt;&lt;p&gt;Locks, lint, tests, BOM/boundary, secret scan, image smoke&lt;/p&gt;&lt;/article&gt;
            &lt;article class=&quot;dvh-gate compact dvh-quality dvh-focusable&quot; data-tags=&quot;assurance components cyber&quot;&gt;&lt;h3&gt;web&lt;/h3&gt;&lt;p&gt;Tests, authz smoke, lint, production build&lt;/p&gt;&lt;/article&gt;
            &lt;article class=&quot;dvh-gate compact dvh-quality dvh-focusable&quot; data-tags=&quot;assurance components&quot;&gt;&lt;h3&gt;mcp&lt;/h3&gt;&lt;p&gt;Install, compile, app import&lt;/p&gt;&lt;/article&gt;
            &lt;article class=&quot;dvh-gate compact dvh-cyber dvh-focusable&quot; data-tags=&quot;assurance components cyber&quot;&gt;&lt;h3&gt;infra&lt;/h3&gt;&lt;p&gt;Terraform format + policy tests&lt;/p&gt;&lt;/article&gt;
            &lt;article class=&quot;dvh-gate compact dvh-quality dvh-focusable&quot; data-tags=&quot;assurance components&quot;&gt;&lt;h3&gt;docs-public&lt;/h3&gt;&lt;p&gt;Strict public MkDocs build&lt;/p&gt;&lt;/article&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;dvh-assurance-column&quot;&gt;
          &lt;div class=&quot;dvh-column-label&quot;&gt;Review &amp;amp; experience workflows&lt;/div&gt;
          &lt;article class=&quot;dvh-gate dvh-quality dvh-focusable&quot; data-tags=&quot;assurance skills cyber ops&quot;&gt;
            &lt;h3&gt;Advisory Code Review&lt;/h3&gt;
            &lt;p&gt;Codex reviews bugs, regressions, tests, auth, routing, queues, deployment, and boundary normalization; artifact + PR comment; one full receipt per head SHA.&lt;/p&gt;
          &lt;/article&gt;
          &lt;article class=&quot;dvh-gate dvh-quality dvh-focusable&quot; data-tags=&quot;assurance components ops&quot;&gt;
            &lt;h3&gt;Visual Regression Gate&lt;/h3&gt;
            &lt;p&gt;Deterministic build, Playwright snapshots + demo clips, baseline diff, optional Gemini review, artifact + comment. Failing threshold blocks.&lt;/p&gt;
          &lt;/article&gt;
          &lt;article class=&quot;dvh-gate dashed dvh-quality dvh-focusable&quot; data-tags=&quot;assurance ops&quot;&gt;
            &lt;h3&gt;Visual Gate Accept Baseline&lt;/h3&gt;
            &lt;p&gt;Maintainer-dispatched; verifies official run, exact PR SHA, artifact ID/digest, capture manifest, and acceptance commit before updating baselines.&lt;/p&gt;
          &lt;/article&gt;
        &lt;/div&gt;

        &lt;div class=&quot;dvh-assurance-column&quot;&gt;
          &lt;div class=&quot;dvh-column-label&quot;&gt;Cyber &amp;amp; release workflows&lt;/div&gt;
          &lt;article class=&quot;dvh-gate dvh-cyber dvh-focusable&quot; data-tags=&quot;cyber assurance components&quot;&gt;
            &lt;h3&gt;Security manifest policy&lt;/h3&gt;
            &lt;p&gt;API/worker/MCP images must be digest-pinned; long-lived containers need probes, non-root execution, no privilege escalation, and dropped capabilities. Exact exceptions expire.&lt;/p&gt;
          &lt;/article&gt;
          &lt;article class=&quot;dvh-gate dvh-cyber dvh-focusable&quot; data-tags=&quot;cyber assurance components&quot;&gt;
            &lt;h3&gt;Extractor Release Certification&lt;/h3&gt;
            &lt;p&gt;Scheduled/manual: reproducible image + provenance; runtime/Python/image CycloneDX SBOMs; context/image/history/artifact secret scans; Trivy blocks HIGH/CRITICAL findings with fixes available.&lt;/p&gt;
          &lt;/article&gt;
          &lt;article class=&quot;dvh-gate dashed dvh-cyber dvh-focusable&quot; data-tags=&quot;cyber assurance&quot;&gt;
            &lt;h3&gt;ZAP API + auth-flow checks&lt;/h3&gt;
            &lt;p&gt;Operator-run scripts and runbooks with deterministic alert policy/triage. Present today, but not wired as a PR workflow in this repository.&lt;/p&gt;
          &lt;/article&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;dvh-merge-bar&quot;&gt;
        &lt;div class=&quot;dvh-node dvh-quality dvh-merge-node dvh-focusable&quot; data-tags=&quot;assurance skills cyber ops&quot;&gt;
          &lt;strong&gt;Merge Readiness workflow&lt;/strong&gt;
          &lt;span&gt;One closing issue · PR sections · changed-area CI · advisory · visual · no unresolved review · current head SHA&lt;/span&gt;
        &lt;/div&gt;
        &lt;span class=&quot;dvh-merge-arrow&quot;&gt;→&lt;/span&gt;
        &lt;div class=&quot;dvh-node dvh-orchestration dvh-merge-node dvh-focusable&quot; data-tags=&quot;assurance ops&quot;&gt;
          &lt;strong&gt;ready / ready-with-risks / not-ready&lt;/strong&gt;
          &lt;span&gt;Single PR comment + 14-day evidence bundle&lt;/span&gt;
        &lt;/div&gt;
        &lt;span class=&quot;dvh-merge-arrow&quot;&gt;→&lt;/span&gt;
        &lt;div class=&quot;dvh-node dvh-human dvh-merge-node dvh-focusable&quot; data-tags=&quot;ops assurance&quot;&gt;
          &lt;strong&gt;Product Owner merges to dev&lt;/strong&gt;
          &lt;span&gt;Independent second approval optional; Done only after merge&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dvh-band&quot; aria-labelledby=&quot;dvh-loop-title&quot;&gt;
      &lt;div class=&quot;dvh-band-head&quot;&gt;
        &lt;div class=&quot;dvh-band-title&quot;&gt;&lt;span class=&quot;dvh-index&quot;&gt;05&lt;/span&gt;&lt;h2 id=&quot;dvh-loop-title&quot;&gt;Product orchestrator control loops&lt;/h2&gt;&lt;/div&gt;
        &lt;span class=&quot;dvh-band-note&quot;&gt;The manager owns convergence; automation observes and proves, but does not merge.&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;dvh-loop&quot;&gt;
        &lt;article class=&quot;dvh-loop-step dvh-orchestration dvh-focusable&quot; data-tags=&quot;ops skills&quot;&gt;
          &lt;div class=&quot;dvh-kicker&quot;&gt;Active orchestration&lt;/div&gt;
          &lt;h3&gt;Product orchestrator&lt;/h3&gt;
          &lt;p&gt;Loads issue labels first, audits scope, chooses single/epic mode, assigns bounded lane contracts, integrates one lane at a time, and tracks tests + risks.&lt;/p&gt;
        &lt;/article&gt;
        &lt;article class=&quot;dvh-loop-step dvh-orchestration dvh-focusable&quot; data-tags=&quot;ops assurance&quot;&gt;
          &lt;div class=&quot;dvh-kicker&quot;&gt;Event loop&lt;/div&gt;
          &lt;h3&gt;Orchestrator Event Hooks&lt;/h3&gt;
          &lt;p&gt;Issue/PR activity emits task_started, blocked, pr_opened, and ready_to_merge events. Notification is logged; optional iMessage adapter can forward it.&lt;/p&gt;
        &lt;/article&gt;
        &lt;article class=&quot;dvh-loop-step dvh-orchestration dvh-focusable&quot; data-tags=&quot;ops assurance&quot;&gt;
          &lt;div class=&quot;dvh-kicker&quot;&gt;Observe every 10 min&lt;/div&gt;
          &lt;h3&gt;Orchestrator Monitor&lt;/h3&gt;
          &lt;p&gt;Deterministically compares delivery board status with labels and linked PRs, detects failing checks, and uploads a low-token JSON audit. Auto-reconcile remains optional.&lt;/p&gt;
        &lt;/article&gt;
        &lt;article class=&quot;dvh-loop-step dvh-human dvh-focusable&quot; data-tags=&quot;ops skills assurance cyber&quot;&gt;
          &lt;div class=&quot;dvh-kicker&quot;&gt;Human-curated improvement&lt;/div&gt;
          &lt;h3&gt;Evidence becomes memory&lt;/h3&gt;
          &lt;p&gt;Accepted findings and operating lessons update versioned skills, AGENTS guidance, tests, or runbooks; harness validation makes that learning enforceable next time.&lt;/p&gt;
        &lt;/article&gt;
      &lt;/div&gt;

      &lt;div class=&quot;dvh-loop-return dvh-node dvh-cyber dvh-focusable&quot; data-tags=&quot;ops assurance cyber components&quot;&gt;
        &lt;strong&gt;Failed check · advisory finding · visual regression · policy violation · stale SHA&lt;/strong&gt;
        &lt;span class=&quot;dvh-loop-arrow&quot;&gt;→&lt;/span&gt;
        &lt;strong&gt;Return only to the owning lane; fix, re-run the narrow checks, and push a new head&lt;/strong&gt;
        &lt;span class=&quot;dvh-loop-arrow&quot;&gt;→&lt;/span&gt;
        &lt;strong&gt;Invalidate stale evidence; re-run affected workflows; aggregate readiness again ↺&lt;/strong&gt;
      &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;product-agentic-harness&#x27;);
      if (!root) return;

      const summaries = {
        all: &#x27;End to end: approved intent → scoped issue → isolated implementation → evidence-backed PR → human merge → monitored project state.&#x27;,
        skills: &#x27;Eleven repo-local skills externalize the repeatable decisions: shaping, lifecycle, isolation, validation, evidence, review, packaging, and readiness.&#x27;,
        components: &#x27;Seven primary change surfaces plus cross-component contracts share one path-aware router, so each lane proves only what its diff can affect.&#x27;,
        assurance: &#x27;A changed-area CI fan-out runs beside advisory, visual, policy, and release workflows; merge readiness consolidates their current-head evidence.&#x27;,
        cyber: &#x27;Cyber assurance is layered: sensitive-data hygiene, authz smoke, deployment hardening policy, extractor provenance/SBOM/Trivy scans, and operator-run ZAP checks.&#x27;,
        ops: &#x27;The orchestrator drives issue-to-merge convergence; GitHub hooks notify on state changes, a 10-minute deterministic monitor audits drift, and blockers loop back to the owning lane.&#x27;
      };

      const buttons = [...root.querySelectorAll(&#x27;[data-focus]&#x27;)];
      const focusable = [...root.querySelectorAll(&#x27;.dvh-focusable&#x27;)];
      const summary = root.querySelector(&#x27;[data-focus-summary]&#x27;);

      function setFocus(value) {
        buttons.forEach((button) =&gt; {
          const selected = button.dataset.focus === value;
          button.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
          button.classList.toggle(&#x27;btn-primary&#x27;, selected);
        });

        focusable.forEach((element) =&gt; {
          const tags = (element.dataset.tags || &#x27;&#x27;).split(/\s+/).filter(Boolean);
          const selected = value === &#x27;all&#x27; || tags.includes(value);
          element.classList.toggle(&#x27;is-dim&#x27;, !selected);
          element.classList.toggle(&#x27;is-focus&#x27;, value !== &#x27;all&#x27; &amp;&amp; selected);
        });

        if (summary) summary.textContent = summaries[value] || summaries.all;
      }

      buttons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; setFocus(button.dataset.focus || &#x27;all&#x27;));
      });
    })();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
